name: Build playlist
on:
  schedule:
    - cron: "30 20 * * *"
  push:
    branches: ["master"]
    paths-ignore:
      - "playlist.m3u"
      - ".github/**"
  pull_request:
    branches: ["master"]
    paths-ignore:
      - "playlist.m3u"
      - ".github/**"

jobs:
  playlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t pcm3u -f docker/Dockerfile .
      - name: Get m3u
        run: docker run -i -e ZIPPASSWORD=${{ secrets.ZIPPASSWORD }} -e UA=${{ secrets.UA }} --rm pcm3u m3u > pcradio.m3u
      - name: Commit changes
        uses: EndBug/add-and-commit@v10
        with:
          message: "upd"
          add: "pcradio.m3u"
